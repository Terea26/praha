document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

59-60c9ce0d48b6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#F6F1E7;color:#1B1F2A;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#8B1A2B;text-decoration:none}\na:hover{color:#5E0F1C}\nbutton{font-family:inherit;cursor:pointer}\ninput,select,textarea{font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<div style=\"background:#8B1A2B;color:#F6E7C8;font-size:13px;padding:9px 24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center\">\n  <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.06em;color:#D4A537\">PILOTNÍ PROVOZ<\u002Fspan>\n  <span>Praha Bonus nyní testujeme v Praze 7. Ostatní obvody se připojí po vyhodnocení pilotu.<\u002Fspan>\n<\u002Fdiv>\n\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(246,241,231,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E4DACA\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;color:#1B1F2A\">\n      <span style=\"width:30px;height:30px;border-radius:50%;background:#D4A537;display:grid;place-items:center;color:#8B1A2B;font-family:'DM Serif Display',serif;font-size:19px;line-height:1\">P<\u002Fspan>\n      <span style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.01em\">Praha Bonus<\u002Fspan>\n    <\u002Fa>\n    <nav style=\"display:flex;gap:22px;flex-wrap:wrap;font-size:14px;font-weight:600;flex:1\">\n      <a href=\"#jak-to-funguje\" style=\"color:#3A3F4C\">Jak to funguje<\u002Fa>\n      <a href=\"#rodina\" style=\"color:#3A3F4C\">Rodina<\u002Fa>\n      <a href=\"#body\" style=\"color:#3A3F4C\">Sbírání bodů<\u002Fa>\n      <a href=\"#odmeny\" style=\"color:#3A3F4C\">Odměny<\u002Fa>\n      <a href=\"#kalkulacka\" style=\"color:#3A3F4C\">Kalkulačka<\u002Fa>\n      <a href=\"#soukromi\" style=\"color:#3A3F4C\">Soukromí<\u002Fa>\n      <a href=\"#partneri\" style=\"color:#3A3F4C\">Pro partnery<\u002Fa>\n      <a href=\"#dotazy\" style=\"color:#3A3F4C\">Časté dotazy<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;gap:10px\">\n      <button style=\"background:transparent;border:1px solid #CFC3AE;color:#1B1F2A;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px\" style-hover=\"background:#EDE4D3\">Přihlásit se<\u002Fbutton>\n      <a href=\"#registrace\" style=\"background:#1B1F2A;color:#F6F1E7;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px\" style-hover=\"background:#8B1A2B;color:#F6F1E7\">Zaregistrovat se<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"position:relative;overflow:hidden;background:#F6F1E7\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:72px 24px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px;align-items:center;position:relative;z-index:2\">\n    <div style=\"padding-bottom:40px\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#EFE5D2;border:1px solid #E1D3B8;border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;font-weight:600;color:#5A4A2E\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#3E8E5A\"><\u002Fspan>Městská peněženka odměn hl. m. Prahy\n      <\u002Fdiv>\n      <div style=\"display:flex;margin-top:22px\">\n        <div style=\"display:inline-flex;background:#EDE4D3;border:1px solid #E1D3B8;border-radius:999px;padding:4px;gap:4px\">\n          <sc-for list=\"{{ modeTabs }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ m.select }}\" style=\"border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isIndividual }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(44px,6.4vw,82px);line-height:.98;letter-spacing:-.02em;margin:22px 0 22px;text-wrap:balance\">Děláte pro Prahu dobré věci. <em style=\"color:#8B1A2B\">Praha vám to vrátí.<\u002Fem><\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.55;color:#4A4F5C;max-width:520px;margin:0 0 32px;text-wrap:pretty\">Jedna městská peněženka, která odměňuje Pražany za dobré skutky. Sbírejte body za jízdu MHD, recyklaci, dobrovolnictví nebo nahlášení závady a utraťte je v bazénech, muzeích, knihovnách a u místních podniků.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isFamily }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(44px,6.4vw,82px);line-height:.98;letter-spacing:-.02em;margin:22px 0 22px;text-wrap:balance\">Celá rodina sbírá, <em style=\"color:#8B1A2B\">celá rodina si užívá.<\u002Fem><\u002Fh1>\n        <p style=\"font-size:19px;line-height:1.55;color:#4A4F5C;max-width:520px;margin:0 0 32px;text-wrap:pretty\">Děti sbírají body cestou do školy, v knihovně a na výpravách po Praze. Rodiče je přidají ke svým. Utratíte je společně – v bazénu, v zoo nebo na táboře.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a href=\"#registrace\" style=\"background:#8B1A2B;color:#FFF;padding:16px 26px;border-radius:999px;font-weight:700;font-size:16px\" style-hover=\"background:#6E1322;color:#FFF\">Začít sbírat body<\u002Fa>\n        <a href=\"#kalkulacka\" style=\"background:transparent;color:#1B1F2A;padding:15px 24px;border-radius:999px;font-weight:700;font-size:16px;border:1.5px solid #1B1F2A\" style-hover=\"background:#1B1F2A;color:#F6F1E7\">Spočítat moje body<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:24px;margin-top:34px;flex-wrap:wrap;font-size:14px;color:#5B6070\">\n        <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"color:#8B1A2B;font-weight:800\">✓<\u002Fspan>Zdarma a dobrovolně<\u002Fspan>\n        <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"color:#8B1A2B;font-weight:800\">✓<\u002Fspan>Data uložená v EU<\u002Fspan>\n        <span style=\"display:flex;gap:8px;align-items:center\"><span style=\"color:#8B1A2B;font-weight:800\">✓<\u002Fspan>Funguje s Lítačkou<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:center;padding-bottom:110px\">\n      <div style=\"width:100%;max-width:400px;background:#FFFDF8;border:1px solid #E4DACA;border-radius:28px;box-shadow:0 30px 60px -30px rgba(60,30,20,.35);overflow:hidden\">\n        <div style=\"background:#8B1A2B;color:#F6E7C8;padding:22px 24px 26px;position:relative;overflow:hidden\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:13px\">\n            <span style=\"font-weight:600\">{{ wallet.name }}<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#D4A537\">TENTO TÝDEN<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;font-size:13px;opacity:.85\">Zůstatek<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:10px\">\n            <span style=\"font-family:'DM Serif Display',serif;font-size:64px;line-height:1;color:#FFF\">{{ wallet.balance }}<\u002Fspan>\n            <span style=\"font-weight:700;color:#D4A537\">bodů<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px;height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden\"><div style=\"width:{{ wallet.bar }}%;height:100%;background:#D4A537;border-radius:3px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"margin-top:8px;font-size:13px\">{{ wallet.note }}<\u002Fdiv>\n          <sc-if value=\"{{ isFamily }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;display:flex;gap:6px;flex-wrap:wrap\">\n              <sc-for list=\"{{ familyShares }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <span style=\"background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600\">{{ m.name }} <span style=\"color:#D4A537;font-family:'JetBrains Mono',monospace\">{{ m.pts }}<\u002Fspan><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"padding:8px 24px 18px\">\n          <sc-for list=\"{{ heroActivity }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #EFE7D9\">\n              <span style=\"width:36px;height:36px;border-radius:12px;background:#F3EAD8;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:#8B1A2B\">{{ a.code }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-weight:700;font-size:14px\">{{ a.title }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7A7F8C\">{{ a.note }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;color:#2F7A4B\">{{ a.pts }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <img src=\"a4e34dfa-6fc6-4c70-b566-d3c1ad9c5ca3\" alt=\"\" style=\"position:absolute;left:0;right:0;bottom:-2px;width:100%;height:auto;max-height:220px;object-fit:cover;object-position:bottom;opacity:.12;z-index:1;pointer-events:none\">\n<\u002Fsection>\n\n<section style=\"background:#1B1F2A;color:#F6F1E7\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:44px 24px;display:flex;gap:32px;align-items:center;flex-wrap:wrap\">\n    <div style=\"font-family:'DM Serif Display',serif;font-size:clamp(48px,6vw,72px);line-height:1;color:#D4A537\">−45 % CO₂<\u002Fdiv>\n    <p style=\"flex:1;min-width:260px;margin:0;font-size:17px;line-height:1.55;color:#C9CCD6;text-wrap:pretty\">Praha se zavázala snížit emise CO₂ do roku 2030 o 45 % oproti roku 2010. K tomu je potřeba milionů každodenních rozhodnutí. Praha Bonus je jedno jednoduché místo, kde se tato rozhodnutí počítají a odměňují.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"jak-to-funguje\" style=\"max-width:1240px;margin:0 auto;padding:110px 24px 40px;width:100%\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">JAK TO FUNGUJE<\u002Fdiv>\n  <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:14px 0 48px;max-width:760px;text-wrap:balance\">Sbírejte body za dobré skutky, utraťte je ve městě.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:22px;padding:30px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B1A2B;font-weight:700\">01 · SBÍREJTE<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:14px 0 16px\">Za to, co ve městě děláte<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15px;color:#4A4F5C\">\n        <span>MHD, sdílená kola a chůze<\u002Fspan><span>Recyklace a opravy<\u002Fspan><span>Dobrovolnictví<\u002Fspan><span>Hlášení závad<\u002Fspan><span>Zapojení do dění v obvodu<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#8B1A2B;color:#F6E7C8;border-radius:22px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;min-height:280px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#D4A537;font-weight:700\">02 · JEDEN ZŮSTATEK<\u002Fdiv>\n      <div>\n        <div style=\"width:84px;height:84px;border-radius:50%;background:#D4A537;display:grid;place-items:center;color:#8B1A2B;font-family:'DM Serif Display',serif;font-size:42px;margin-bottom:18px\">P<\u002Fdiv>\n        <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:0 0 8px;color:#FFF\">Pražské body<\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.5\">Všechny body na jednom místě, bez ohledu na to, kde jste je získali.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:22px;padding:30px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B1A2B;font-weight:700\">03 · UTRÁCEJTE<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:14px 0 16px\">Tam, kde Praha žije<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:9px;font-size:15px;color:#4A4F5C\">\n        <span>Slevy na MHD<\u002Fspan><span>Městské bazény<\u002Fspan><span>Muzea, galerie a knihovna<\u002Fspan><span>Místní kavárny a obchody<\u002Fspan><span>Dar na projekty v obvodu<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rodina\" style=\"max-width:1240px;margin:0 auto;padding:90px 24px 20px;width:100%\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">PRAHA BONUS RODINA<\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin:14px 0 40px\">\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:0;max-width:720px;text-wrap:balance\">Celá rodina sbírá, celá rodina si užívá.<\u002Fh2>\n    <p style=\"max-width:420px;margin:0;color:#5B6070;font-size:15px;line-height:1.55\">Děti sbírají body cestou do školy, v knihovně a na výpravách po Praze. Rodiče je přidají ke svým. Utratíte je společně – v bazénu, v zoo nebo na táboře.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B1A2B;font-weight:700\">RODINNÝ ÚČET<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:0\">Založí ho rodič<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A4F5C\">Děti přidáte jen s přezdívkou a věkovou skupinou. Žádný e-mail, žádný telefon, žádné osobní údaje.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B1A2B;font-weight:700\">SPOLEČNÝ ZŮSTATEK<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:0\">Každý přispěje<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A4F5C\">Jeden rodinný zůstatek. Aplikace ukazuje, kolik kdo přidal.<\u002Fp>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:4px\">\n        <span style=\"background:#F3EAD8;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700\">Tereza 290<\u002Fspan>\n        <span style=\"background:#F3EAD8;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700\">Kuba 120<\u002Fspan>\n        <span style=\"background:#F3EAD8;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700\">Ema 80<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:#8B1A2B;font-weight:700\">JUNIOR<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin:0\">Jednoduchý režim pro děti<\u002Fh3>\n      <p style=\"margin:0;font-size:15px;line-height:1.55;color:#4A4F5C\">Děti používají režim Junior v telefonu rodiče, později i na školním tabletu.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:20px;background:#1B1F2A;color:#F6F1E7;border-radius:26px;padding:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px;align-items:center\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#D4A537;font-weight:700\">TŘÍDY A ŠKOLY<\u002Fdiv>\n      <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1.1;margin:12px 0 18px\">Každá třída má svůj zůstatek<\u002Fh3>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.5;color:#C9CCD6\">\n        <span>Cesty dětí do školy pěšky nebo na kole plní třídního „hada“.<\u002Fspan>\n        <span>Třída společně rozhodne, za co body utratí: výlet, sportovní den nebo dar na školní hřiště.<\u002Fspan>\n        <span>Děti se jednotlivě neporovnávají. Soutěží jen třídy a školy.<\u002Fspan>\n        <span>Učitel potvrdí „přišli pěšky“ jedním klepnutím denně.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#262B38;border-radius:20px;padding:26px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px\">\n        <span style=\"font-weight:700\">3.B · ZŠ Praha 7<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;color:#D4A537;font-weight:700\">{{ snakeDone }} / {{ snakeGoal }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(10,1fr);gap:6px\">\n        <sc-for list=\"{{ snake }}\" as=\"s\" hint-placeholder-count=\"30\">\n          <div style=\"aspect-ratio:1;border-radius:50%;background:{{ s.bg }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;font-size:13px;color:#A9AEBB\">Cíl třídy: výlet do zoo. Každý kroužek je jedna cesta do školy bez auta.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ addWalk }}\" style=\"margin-top:16px;background:#D4A537;color:#1B1F2A;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px\" style-hover=\"background:#E2B748\">Potvrdit dnešní cesty<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"body\" style=\"max-width:1240px;margin:0 auto;padding:90px 24px;width:100%\">\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px\">\n    <div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">SBÍRÁNÍ BODŮ<\u002Fdiv>\n      <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:14px 0 0;text-wrap:balance\">Každá aktivita je nejdřív ověřena<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"max-width:380px;margin:0;color:#5B6070;font-size:15px;line-height:1.55\">Body připíšeme až po potvrzení. Díky tomu má každý bod skutečnou hodnotu.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px\">\n    <sc-for list=\"{{ earnTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ t.select }}\" style=\"padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ earnIsKids }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:26px;padding:10px 32px\">\n      <sc-for list=\"{{ kidsEarn }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px 24px;padding:20px 0;border-bottom:1px solid #EFE7D9;align-items:center\">\n          <div style=\"font-weight:800;font-size:17px\">{{ k.action }}<\u002Fdiv>\n          <div style=\"font-size:15px;color:#5B6070;line-height:1.45\">{{ k.verify }}<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-weight:700;color:#8B1A2B\">{{ k.pts }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <p style=\"margin:18px 0 14px;font-size:14px;color:#7A7F8C\">Pohyb dětí nikdy nesledujeme přes GPS. Aktivity potvrzuje škola, knihovna, kroužek nebo QR kód na místě.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ earnIsAdult }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:26px;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))\">\n    <div style=\"padding:38px;display:flex;flex-direction:column;gap:28px\">\n      <div>\n        <div style=\"font-size:13px;font-weight:700;color:#7A7F8C;text-transform:uppercase;letter-spacing:.06em\">Příklady v Praze<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:30px;line-height:1.2;margin-top:10px;text-wrap:pretty\">{{ earn.examples }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;color:#7A7F8C;text-transform:uppercase;letter-spacing:.06em\">Jak se ověřuje<\u002Fdiv>\n        <div style=\"font-size:17px;line-height:1.5;margin-top:10px;color:#3A3F4C\">{{ earn.verify }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#F3EAD8;padding:38px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;border-left:1px solid #E4DACA\">\n      <div style=\"font-family:'DM Serif Display',serif;font-size:120px;line-height:.9;color:#8B1A2B\">{{ earn.pts }}<\u002Fdiv>\n      <div style=\"font-weight:700;font-size:18px\">bodů {{ earn.unit }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n\n<section id=\"odmeny\" style=\"background:#EFE5D2;border-top:1px solid #E1D3B8;border-bottom:1px solid #E1D3B8\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:100px 24px;width:100%\">\n    <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">KATALOG ODMĚN<\u002Fdiv>\n        <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:14px 0 0\">Odměny, které Praha už má<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ rewardTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.select }}\" style=\"padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px\">\n      <sc-for list=\"{{ rewards }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"background:#FFFDF8;border:1px solid #E1D3B8;border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px;min-height:240px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;font-weight:700;color:#8B1A2B\">{{ r.tag }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#7A7F8C\">{{ r.where }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:26px;line-height:1.1;margin:0\">{{ r.title }}<\u002Fh3>\n          <p style=\"margin:0;color:#5B6070;font-size:15px;line-height:1.5;flex:1\">{{ r.desc }}<\u002Fp>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;border-top:1px solid #EFE7D9;padding-top:14px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px\">{{ r.ptsLabel }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ r.pick }}\" style=\"background:#1B1F2A;color:#F6F1E7;border:0;border-radius:999px;padding:9px 15px;font-weight:700;font-size:13px\" style-hover=\"background:#8B1A2B\">{{ r.cta }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:28px 0 0;font-size:15px;color:#5B6070;max-width:760px;line-height:1.55\">Většina odměn město téměř nic nestojí. Prázdná dráha v bazénu v úterý ráno nebo klidné odpoledne v muzeu jsou volná kapacita. Praha Bonus z ní dělá odměnu a pomáhá zaplnit hodiny mimo špičku. Místní podniky si své odměny financují samy.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"kalkulacka\" style=\"max-width:1240px;margin:0 auto;padding:100px 24px;width:100%\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">KALKULAČKA<\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin:14px 0 36px\">\n    <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:0\">Kolik nasbíráte za týden?<\u002Fh2>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <div style=\"display:inline-flex;background:#EDE4D3;border:1px solid #E1D3B8;border-radius:999px;padding:4px;gap:4px\">\n        <sc-for list=\"{{ calcModeTabs }}\" as=\"m\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ m.select }}\" style=\"border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ loadPreset }}\" style=\"background:#FFFDF8;border:1.5px solid #CFC3AE;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px\" style-hover=\"border-color:#8B1A2B\">{{ presetLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetCalc }}\" style=\"background:transparent;border:0;padding:10px 12px;font-weight:700;font-size:14px;color:#7A7F8C\" style-hover=\"color:#1B1F2A\">Vynulovat<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start\">\n    <div style=\"background:#FFFDF8;border:1px solid #E4DACA;border-radius:24px;padding:10px 28px\">\n      <sc-for list=\"{{ calcRows }}\" as=\"c\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #EFE7D9;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:180px\">\n            <div style=\"font-weight:700;font-size:16px\">{{ c.label }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#7A7F8C\">{{ c.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\">\n weight:800;font-size:16px\">{{ p.title }}<\u002Fspan>\n            <span style=\"font-size:14px;color:#A9AEBB;line-height:1.45\">{{ p.desc }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:24px 0 0;font-size:14px;color:#A9AEBB;line-height:1.55\">Město stanoví pevný roční rozpočet bodů. Body nejsou peníze: nelze je vyplatit ani převést a po 12 měsících vyprší.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#F6F1E7;color:#1B1F2A;border-radius:26px;padding:34px\">\n      <sc-if value=\"{{ partnerSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"min-height:380px;display:flex;flex-direction:column;justify-content:center;gap:12px\">\n          <div style=\"width:56px;height:56px;border-radius:50%;background:#D4A537;display:grid;place-items:center;font-size:26px;color:#8B1A2B;font-weight:800\">✓<\u002Fdiv>\n          <h3 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:32px;margin:0\">Děkujeme, ozveme se.<\u002Fh3>\n          <p style=\"margin:0;color:#5B6070;font-size:15px\">Žádost ({{ partnerTitle }}) jsme přijali. Do pěti pracovních dnů vás bude kontaktovat náš tým.<\u002Fp>\n          <button sc-camel-on-click=\"{{ resetPartner }}\" style=\"align-self:flex-start;margin-top:10px;background:transparent;border:1.5px solid #1B1F2A;border-radius:999px;padding:10px 16px;font-weight:700\">Odeslat další žádost<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ partnerOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <div style=\"font-size:13px;color:#7A7F8C;font-weight:700\">Žádost o partnerství<\u002Fdiv>\n            <div style=\"font-family:'DM Serif Display',serif;font-size:28px;margin-top:4px\">{{ partnerTitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Název organizace<input placeholder=\"např. Kavárna Letná\" style=\"padding:14px;border-radius:12px;border:1px solid #CFC3AE;background:#FFF;font-size:15px\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Kontaktní osoba<input placeholder=\"Jméno a příjmení\" style=\"padding:14px;border-radius:12px;border:1px solid #CFC3AE;background:#FFF;font-size:15px\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">E-mail<input type=\"email\" placeholder=\"vas@email.cz\" style=\"padding:14px;border-radius:12px;border:1px solid #CFC3AE;background:#FFF;font-size:15px\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700\">Městská část<sc-raw-select style=\"padding:14px;border-radius:12px;border:1px solid #CFC3AE;background:#FFF;font-size:15px\"><option>Praha 7<\u002Foption><option>Jiná městská část<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n          <button sc-camel-on-click=\"{{ sendPartner }}\" style=\"margin-top:6px;background:#8B1A2B;color:#FFF;border:0;border-radius:999px;padding:16px;font-weight:700;font-size:16px\" style-hover=\"background:#6E1322\">Odeslat žádost<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"dotazy\" style=\"max-width:900px;margin:0 auto;padding:100px 24px;width:100%\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#8B1A2B;font-weight:700\">ČASTÉ DOTAZY<\u002Fdiv>\n  <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,54px);line-height:1.05;margin:14px 0 36px\">Na co se lidé ptají<\u002Fh2>\n  <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"5\">\n    <div style=\"border-top:1px solid #DCCFB8\">\n      <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;background:transparent;border:0;padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:left;color:#1B1F2A\">\n        <span style=\"font-weight:700;font-size:18px\">{{ f.q }}<\u002Fspan>\n        <span style=\"font-size:24px;color:#8B1A2B;width:24px;text-align:center\">{{ f.icon }}<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0 0 24px;color:#4A4F5C;font-size:16px;line-height:1.6;max-width:720px\">{{ f.a }}<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n\n<section id=\"registrace\" style=\"max-width:1240px;margin:0 auto;padding:0 24px 0;width:100%\">\n  <div style=\"background:#D4A537;border-radius:30px;padding:56px 44px;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap\">\n    <div style=\"max-width:560px\">\n      <h2 style=\"font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,52px);line-height:1.05;margin:0 0 12px;color:#1B1F2A\">Bydlíte v Praze 7? Zapojte se do pilotu.<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;color:#3A2E12\">Registrace trvá dvě minuty. Stačí e-mail a volitelně propojení s Lítačkou.<\u002Fp>\n    <\u002Fdiv>\n    <sc-if value=\"{{ signedUp }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#1B1F2A;color:#F6F1E7;padding:18px 24px;border-radius:999px;font-weight:700\">Hotovo. Odkaz k aktivaci jsme poslali na váš e-mail.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ notSignedUp }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;flex:1;max-width:460px\">\n        <input type=\"email\" placeholder=\"vas@email.cz\" style=\"flex:1;min-width:200px;padding:16px 20px;border-radius:999px;border:0;font-size:16px;background:#FFFDF8\">\n        <button sc-camel-on-click=\"{{ signUp }}\" style=\"background:#1B1F2A;color:#F6F1E7;border:0;border-radius:999px;padding:16px 24px;font-weight:700;font-size:16px\" style-hover=\"background:#8B1A2B\">Zaregistrovat<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"margin-top:80px;position:relative\">\n  <img src=\"43f11dd2-7be2-4cf8-908e-13f6a934d8cd\" alt=\"\" style=\"display:block;width:100%;height:auto;margin-bottom:-1px\">\n  <div style=\"background:#13161F;color:#A9AEBB\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:48px 24px 36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:32px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:10px;color:#F6F1E7\">\n          <span style=\"width:28px;height:28px;border-radius:50%;background:#D4A537;display:grid;place-items:center;color:#8B1A2B;font-family:'DM Serif Display',serif;font-size:17px\">P<\u002Fspan>\n          <span style=\"font-family:'DM Serif Display',serif;font-size:22px\">Praha Bonus<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.55;margin:14px 0 0\">Provozuje nezávislý provozovatel ve spolupráci s hlavním městem Prahou.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\">\n        <span style=\"color:#F6F1E7;font-weight:700\">Pro obyvatele<\u002Fspan>\n        <a href=\"#body\" style=\"color:#A9AEBB\">Sbírání bodů<\u002Fa><a href=\"#odmeny\" style=\"color:#A9AEBB\">Odměny<\u002Fa><a href=\"#kalkulacka\" style=\"color:#A9AEBB\">Kalkulačka<\u002Fa><a href=\"#dotazy\" style=\"color:#A9AEBB\">Časté dotazy<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\">\n        <span style=\"color:#F6F1E7;font-weight:700\">Pro partnery<\u002Fspan>\n        <a href=\"#partneri\" style=\"color:#A9AEBB\">Místní podniky<\u002Fa><a href=\"#partneri\" style=\"color:#A9AEBB\">Firemní výzvy<\u002Fa><a href=\"#partneri\" style=\"color:#A9AEBB\">Neziskové organizace<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\">\n        <span style=\"color:#F6F1E7;font-weight:700\">Informace<\u002Fspan>\n        <a href=\"#soukromi\" style=\"color:#A9AEBB\">Ochrana osobních údajů<\u002Fa><a href=\"#pilot\" style=\"color:#A9AEBB\">Pilot Praha 7<\u002Fa><a href=\"#top\" style=\"color:#A9AEBB\">Kontakt<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding:18px 24px 30px;border-top:1px solid #262B38;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n      <span>© 2026 Praha Bonus<\u002Fspan><span>Hostováno v EU · v souladu s GDPR<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst EARN = [\n  { id:'doprava', label:'Doprava', examples:'Metro, tramvaj a autobus DPP, sdílená kola, chůze', verify:'Detekce cesty v telefonu nebo propojený účet Lítačky či sdílených kol.', pts:10, unit:'za cestu' },\n  { id:'recyklace', label:'Recyklace', examples:'Odevzdání odpadu ve sběrném dvoře nebo návštěva Repair Café', verify:'Naskenování QR kódu na místě.', pts:20, unit:'za návštěvu' },\n  { id:'dobrovolnictvi', label:'Dobrovolnictví', examples:'Směna v potravinové bance, úklid parku, doučování', verify:'Organizace potvrdí odpracované hodiny ve svém přehledu.', pts:50, unit:'za hodinu' },\n  { id:'hlaseni', label:'Hlášení závad', examples:'Výtluk, nefunkční lampa, černá skládka', verify:'Hlášení jde na městskou část. Body přijdou až po potvrzení.', pts:15, unit:'za hlášení' },\n  { id:'participace', label:'Participace', examples:'Anketa v obvodu, veřejné setkání, hlasování o participativním rozpočtu', verify:'Potvrzuje městská participační platforma.', pts:25, unit:'za aktivitu' },\n  { id:'deti', label:'Děti', examples:'', verify:'', pts:0, unit:'' },\n];\nconst KIDS_EARN = [\n  { action:'Pěšky nebo na kole do školy', verify:'Třída to denně zaznamená (digitální hra Dopravní had)', pts:'5 za cestu' },\n  { action:'Výpůjčka knih', verify:'Potvrdí Městská knihovna v Praze', pts:'10 za knihu' },\n  { action:'Výpravy po Praze (Golem, Vyšehrad, muzea)', verify:'QR kód na zastávce výpravy', pts:'20 za zastávku' },\n  { action:'Kroužek nebo sport', verify:'Docházku potvrdí kroužek', pts:'10 za lekci' },\n  { action:'Recyklace s rodičem', verify:'QR kód ve sběrném dvoře (počítá se rodině)', pts:'20 za návštěvu' },\n  { action:'Nahlášení nebezpečného přechodu na cestě do školy', verify:'Potvrdí městská část', pts:'15 za hlášení' },\n];\nconst FAMILY_REWARDS = [\n  { cat:'rodina', tag:'PRO RODINY', where:'Městské bazény', title:'Rodinné plavání', desc:'2 dospělí a 2 děti, mimo špičku.', pts:800 },\n  { cat:'rodina', tag:'PRO RODINY', where:'Zoo Praha', title:'Rodinný vstup do zoo', desc:'Vstup pro celou rodinu do Zoo Praha.', pts:1000 },\n  { cat:'rodina', tag:'PRO RODINY', where:'MMP · galerie', title:'Dětská muzejní dílna', desc:'Muzeum hlavního města Prahy a galerie.', pts:300 },\n  { cat:'rodina', tag:'PRO RODINY', where:'Poskytovatelé aktivit', title:'Sleva na tábor nebo kroužek', desc:'Příměstské tábory a kroužky pro děti.', pts:500 },\n  { cat:'rodina', tag:'PRO RODINY', where:'Městská část', title:'Dar na hřiště', desc:'Darujte body na dětské hřiště ve svém obvodu.', pts:1000 },\n];\nconst CALC_KIDS = [\n  { id:'school', label:'Děti: pěšky nebo na kole do školy', hint:'5 bodů za cestu', pts:5 },\n  { id:'books', label:'Děti: vypůjčené knihy', hint:'10 bodů za knihu', pts:10 },\n  { id:'quest', label:'Děti: zastávky výprav po Praze', hint:'20 bodů za zastávku', pts:20 },\n  { id:'club', label:'Děti: lekce kroužku nebo sportu', hint:'10 bodů za lekci', pts:10 },\n];\nconst NOVAK = { trips:13, recycle:1, vol:3, report:1, part:1, school:5, books:2, quest:2, club:2 };\nconst REWARDS = [\n  { cat:'doprava', tag:'DOPRAVA', where:'DPP', title:'Veřejná doprava', desc:'Slevová poukázka na jízdenku v Lítačce.', pts:300 },\n  { cat:'sport', tag:'SPORT', where:'Městské bazény', title:'Bazény', desc:'Vstup mimo špičku do městských bazénů.', pts:500 },\n  { cat:'kultura', tag:'KULTURA', where:'MMP · GHMP', title:'Muzea a galerie', desc:'Muzeum hlavního města Prahy, Galerie hlavního města Prahy.', pts:400 },\n  { cat:'kultura', tag:'KULTURA', where:'MKP', title:'Městská knihovna', desc:'Registrace nebo služby navíc v Městské knihovně v Praze.', pts:200 },\n  { cat:'podniky', tag:'MÍSTNÍ PODNIKY', where:'Partneři v obvodu', title:'Místní podniky', desc:'Káva, kino a slevy v obchodech partnerů.', pts:150, from:true },\n  { cat:'obvod', tag:'PROJEKTY OBVODU', where:'Praha 7', title:'Projekty obvodu', desc:'Darujte body na stromy, hřiště a parky ve svém obvodu.', pts:1000 },\n];\nconst RTABS = [['vse','Vše'],['rodina','Pro rodiny'],['doprava','Doprava'],['sport','Sport'],['kultura','Kultura'],['podniky','Podniky'],['obvod','Obvod']];\nconst CALC = [\n  { id:'trips', label:'Cesty MHD, na kole nebo pěšky', hint:'10 bodů za cestu', pts:10 },\n  { id:'recycle', label:'Návštěvy sběrného dvora', hint:'20 bodů za návštěvu', pts:20 },\n  { id:'vol', label:'Hodiny dobrovolnictví', hint:'50 bodů za hodinu', pts:50 },\n  { id:'report', label:'Potvrzená hlášení závad', hint:'15 bodů za hlášení', pts:15 },\n  { id:'part', label:'Ankety a hlasování', hint:'25 bodů za aktivitu', pts:25 },\n];\nconst TEREZA = { trips:10, recycle:0, vol:3, report:1, part:1 };\nconst PARTNERS = [\n  { id:'podnik', title:'Místní podnik', desc:'Staňte se partnerem odměn a získejte nové zákazníky. Platíte jen za uplatněnou odměnu.' },\n  { id:'firma', title:'Firma', desc:'Sponzorujte výzvu, například „Do práce na kole v květnu“.' },\n  { id:'mesto', title:'Městská společnost', desc:'Cílené kampaně pro DPP nebo Pražské služby: cestování mimo špičku, recyklace.' },\n  { id:'nno', title:'Nezisková organizace', desc:'Potvrzujte hodiny dobrovolníků ve svém přehledu.' },\n  { id:'skola', title:'Škola', desc:'Zapojení je pro školy zdarma, platí ho město. Učitel potvrzuje cesty do školy jedním klepnutím denně.' },\n  { id:'kruzky', title:'Kroužky a tábory', desc:'Získejte nové přihlášky. Platíte provizi jen z rezervace přes Praha Bonus.' },\n  { id:'sponzor', title:'Sponzor školních výzev', desc:'Pojišťovny a banky mohou sponzorovat školní výzvy. Nikdy ne reklamu dětem.' },\n];\nconst FAQ = [\n  { q:'Je zapojení povinné?', a:'Ne. Praha Bonus je zcela dobrovolný a funguje jen jako odměna. Nikoho netrestáme a nevytváříme žádné hodnocení občanů.' },\n  { q:'Vidí město, kudy jezdím?', a:'Ne. Cesty se rozpoznávají přímo v telefonu a trasy ho nikdy neopustí. Město dostává pouze anonymní souhrny, nikdy údaje o konkrétním člověku.' },\n  { q:'Můžu body vyměnit za peníze?', a:'Ne. Body nejsou peníze, nelze je vyplatit ani převést na jiného uživatele.' },\n  { q:'Platí body napořád?', a:'Body vyprší 12 měsíců od připsání. V aplikaci vždy uvidíte, kdy vám které body propadnou.' },\n  { q:'Kde jsou uložena moje data?', a:'Na serverech v EU, v souladu s GDPR. Osobní údaje neprodáváme ani nesdílíme.' },\n  { q:'Sleduje aplikace polohu mého dítěte?', a:'Ne. Pohyb dětí nikdy nesledujeme přes GPS. Cesty do školy potvrzuje třída, ostatní aktivity knihovna, kroužek nebo QR kód na místě. Dítě má v aplikaci jen přezdívku a věkovou skupinu.' },\n  { q:'Jak se může zapojit škola?', a:'Škola se přihlásí přes formulář Pro partnery. Pro školy je zapojení zdarma, náklady nese město. Učitelé dostanou jednoduchý přehled, kde jedním klepnutím denně potvrdí cesty dětí do školy.' },\n  { q:'Jsou nějaké žebříčky?', a:'Jednotlivci se veřejně neporovnávají. Soutěží pouze městské části mezi sebou.' },\n];\nclass Component extends DCLogic {\n  state = { mode:'ind', calcMode:'ind', walks:18, earn:'doprava', rf:'vse', calc:{...TEREZA}, faq:0, partner:'podnik', partnerSent:false, signedUp:false, picked:null };\n  seg(active){ return active ? { bg:'#1B1F2A', fg:'#F6F1E7' } : { bg:'transparent', fg:'#1B1F2A' }; }\n  pill(active){ return active ? { bg:'#1B1F2A', fg:'#F6F1E7', border:'#1B1F2A' } : { bg:'transparent', fg:'#1B1F2A', border:'#CFC3AE' }; }\n  renderVals() {\n    const s = this.state;\n    const earn = EARN.find(e=>e.id===s.earn);\n    const fam = s.mode==='fam', cFam = s.calcMode==='fam';\n    const sumOf = list=>list.reduce((a,c)=>a+c.pts*(s.calc[c.id]||0),0);\n    const adultSum = sumOf(CALC), kidSum = cFam ? sumOf(CALC_KIDS) : 0;\n    const total = adultSum + kidSum;\n    const rows = cFam ? [...CALC, ...CALC_KIDS] : CALC;\n    const reachList = cFam ? FAMILY_REWARDS : REWARDS;\n    const setN = (id,d)=>this.setState(st=>({calc:{...st.calc,[id]:Math.max(0,Math.min(99,(st.calc[id]||0)+d))}}));\n    const SNAKE = 30;\n    const p = PARTNERS.find(x=>x.id===s.partner);\n    const phases = [\n      { when:'MĚSÍCE 0–3', title:'Spuštění', status:'Probíhá', items:['Jeden obvod: Praha 7','Bazény, pobočky knihovny, 50 místních podniků','QR recyklace, dobrovolnictví, hlášení','Kapacita pro 10 000 obyvatel'], active:true },\n      { when:'MĚSÍCE 3–9', title:'Provoz a měření', status:'Připravujeme', items:['Měsíční výsledky pro obvod','Úprava bodů a odměn podle výsledků','Praha Bonus Rodina ve 2–3 základních školách v Praze 7'] },\n      { when:'OD 9. MĚSÍCE', title:'Celá Praha', status:'Plánováno', items:['Rozšíření do celého města','Napojení Lítačky a sledování mobility','Firemní výzvy'] },\n    ].map(ph=>ph.active\n      ? {...ph, bg:'#8B1A2B', fg:'#F6E7C8', border:'#8B1A2B', badgeBg:'#D4A537', badgeFg:'#1B1F2A'}\n      : {...ph, bg:'#FFFDF8', fg:'#1B1F2A', border:'#E4DACA', badgeBg:'#F3EAD8', badgeFg:'#5A4A2E'});\n    return {\n      modeTabs: [['ind','Pro jednotlivce'],['fam','Pro rodiny']].map(([id,label])=>({ label, ...this.seg(s.mode===id), select:()=>this.setState({mode:id, calcMode:id, calc: id==='fam'?{...NOVAK}:{...TEREZA}}) })),\n      isFamily: fam, isIndividual: !fam,\n      wallet: fam\n        ? { name:'Rodina Novákových · Praha 7', balance:445, bar:56, note:'Ještě 355 bodů do rodinného plavání v Podolí' }\n        : { name:'Tereza · Praha 7', balance:290, bar:58, note:'Ještě 210 bodů do vstupu do bazénu Podolí' },\n      familyShares: [{name:'Tereza',pts:290},{name:'Kuba',pts:45},{name:'Ema',pts:60},{name:'Táta',pts:50}],\n      heroActivity: fam ? [\n        { code:'ŠKOLA', title:'Kuba pěšky do školy', note:'5× tento týden', pts:'+25' },\n        { code:'KNIHA', title:'Kuba: 2 knihy z knihovny', note:'Městská knihovna', pts:'+20' },\n        { code:'VÝPR', title:'Ema s tátou na muzejní výpravě', note:'2 zastávky', pts:'+40' },\n        { code:'SBĚR', title:'Táta ve sběrném dvoře', note:'QR kód na místě', pts:'+20' },\n      ] : [\n        { code:'KOLO', title:'Sdílené kolo do práce', note:'Po–Pá · 5 cest', pts:'+100' },\n        { code:'LAMPA', title:'Nahlášená lampa', note:'Potvrzeno druhý den', pts:'+15' },\n        { code:'DOBR', title:'Potravinová banka', note:'Tříhodinová směna', pts:'+150' },\n        { code:'ANK', title:'Anketa o novém parku', note:'Praha 7', pts:'+25' },\n      ],\n      snake: Array.from({length:SNAKE},(_,i)=>({ bg: i<s.walks ? '#D4A537' : '#3A4050' })),\n      snakeDone: s.walks, snakeGoal: SNAKE,\n      addWalk: ()=>this.setState(st=>({walks: st.walks>=SNAKE ? 0 : Math.min(SNAKE, st.walks+3)})),\n      earnIsKids: s.earn==='deti', earnIsAdult: s.earn!=='deti', kidsEarn: KIDS_EARN,\n      calcModeTabs: [['ind','Jednotlivec'],['fam','Rodina']].map(([id,label])=>({ label, ...this.seg(s.calcMode===id), select:()=>this.setState({calcMode:id, calc: id==='fam'?{...NOVAK}:{...TEREZA}}) })),\n      calcFamily: cFam, adultSum, kidSum,\n      presetLabel: cFam ? 'Rodina Novákových, Praha 7' : 'Týden Terezy z Prahy 7',\n      loadPreset: ()=>this.setState({calc: cFam?{...NOVAK}:{...TEREZA}}),\n      earnTabs: EARN.map(e=>({ label:e.label, ...this.pill(e.id===s.earn), select:()=>this.setState({earn:e.id}) })),\n      earn,\n      rewardTabs: RTABS.map(([id,label])=>({ label, ...this.pill(id===s.rf), select:()=>this.setState({rf:id}) })),\n      rewards: [...REWARDS, ...FAMILY_REWARDS].filter(r=>s.rf==='vse'||r.cat===s.rf).map(r=>({\n        ...r, ptsLabel:(r.from?'od ':'')+r.pts.toLocaleString('cs-CZ')+' b.',\n        cta: s.picked===r.title ? 'Přidáno ✓' : (r.cat==='obvod'||r.title==='Dar na hřiště'?'Darovat':'Vybrat'),\n        pick:()=>this.setState({picked:r.title})\n      })),\n      calcRows: rows.map(c=>({ ...c, n:s.calc[c.id]||0, sum:c.pts*(s.calc[c.id]||0), inc:()=>setN(c.id,1), dec:()=>setN(c.id,-1) })),\n      total, monthly: Math.round(total*4.3).toLocaleString('cs-CZ'),\n      reach: [...reachList].sort((a,b)=>a.pts-b.pts).map(r=>{\n        const ok = total>=r.pts;\n        return { title:r.title, pct:Math.min(100,Math.round(total/r.pts*100)), color: ok?'#D4A537':'#7C8396', status: ok?'Dosažitelné':'chybí '+(r.pts-total) };\n      }),\n      resetCalc:()=>this.setState({calc:{}}),\n      always:['Dobrovolnost: pouze odměny','Cesty rozpoznává telefon, trasy ho nikdy neopustí','Město dostává jen anonymní souhrny','Hosting v EU, GDPR od samého návrhu','Provozuje nezávislý provozovatel, město je partner'],\n      never:['Nikoho netrestáme a nevytváříme hodnocení občanů','Neprodáváme ani nesdílíme osobní údaje','Neukazujeme městu, co dělal konkrétní člověk','Neřadíme lidi veřejně do žebříčků, soutěží jen obvody'],\n      phases,\n      partnerTypes: PARTNERS.map(x=>({ ...x, bg: x.id===s.partner?'rgba(212,165,55,.14)':'transparent', border: x.id===s.partner?'#D4A537':'#2C3242', select:()=>this.setState({partner:x.id, partnerSent:false}) })),\n      partnerTitle: p.title, partnerSent:s.partnerSent, partnerOpen:!s.partnerSent,\n      sendPartner:()=>this.setState({partnerSent:true}), resetPartner:()=>this.setState({partnerSent:false}),\n      faq: FAQ.map((f,i)=>({ ...f, open:s.faq===i, icon:s.faq===i?'−':'+', toggle:()=>this.setState({faq:s.faq===i?-1:i}) })),\n      signedUp:s.signedUp, notSignedUp:!s.signedUp, signUp:()=>this.setState({signedUp:true}),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
